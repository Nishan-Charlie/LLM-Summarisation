[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairsum"
version = "0.1.0"
description = "Risk-controlled fair summarization of patient drug reviews"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
gen = ["torch>=2.2", "transformers>=4.40", "accelerate>=0.30", "bitsandbytes>=0.43"]
annotate = ["openpyxl>=3.1"]
dev = ["pytest>=8"]
kw = ["sentence-transformers>=3", "spacy>=3.7", "scikit-learn>=1.3", "scipy>=1.10", "huggingface_hub>=0.23", "pyarrow>=14", "matplotlib>=3.7", "tqdm>=4.60", "nbformat>=5"]
api = ["openai>=1.40", "anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
