<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Review Summary Check: Part B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* The same light look as Part A's page. */
:root {
  color-scheme: light;
  --page: #f5f7fa; --surface: #ffffff; --sunk: #f0f3f7; --line: #dde2ea; --line-strong: #c4ccd8;
  --ink: #161d29; --ink-2: #3a4556; --muted: #5f6b7d;
  --accent: #2357a5; --accent-ink: #ffffff; --accent-soft: #e9f0fb;
  --ok: #18794a; --ok-soft: #e5f4ec; --warn: #8a5800; --warn-soft: #fcf2dc; --bad: #b42318; --bad-soft: #fdecea;
  --pos: #1d68c9; --pos-soft: #e8f0fc; --neg: #bf4d0d; --neg-soft: #fdefe5;
  --ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 16px/1.55 var(--ui); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(255,255,255,.96);
  backdrop-filter: saturate(1.2) blur(6px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: grid; gap: 10px; }
.top-in > * { min-width: 0; }  /* 46 set buttons scroll inside their strip instead of widening the page */
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: grid; gap: 2px; margin-right: auto; }
.eyebrow { font: 500 11px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.brand h1 { font-size: 20px; font-weight: 700; }
.meter { display: grid; gap: 5px; min-width: 210px; }
.meter b { font-size: 15px; font-variant-numeric: tabular-nums; }
.track { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 4px; transition: width .3s; }
.save { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--muted); }
.save::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.save[data-state="saving"]::before { background: var(--warn); }
.save[data-state="error"] { color: var(--bad); }
.save[data-state="error"]::before { background: var(--bad); }
.save[data-state="idle"]:empty::before { display: none; }
.who { font: 500 13px/1 var(--mono); padding: 7px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 9px 14px;
  cursor: pointer; font-size: 15px; font-weight: 700; color: var(--ink); min-height: 42px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #1c4a8f; color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
.btn[disabled] { opacity: .45; cursor: default; }

.strip { display: flex; align-items: center; gap: 10px; }
.strip-label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; font: 500 13px/1 var(--mono); min-width: 40px; height: 34px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip[data-state="partial"] { background: var(--warn-soft); border-color: #d9a640; color: var(--ink); }
.chip[data-state="done"] { background: var(--ok-soft); border-color: #5fb487; color: var(--ink); }
.chip[aria-current="true"] { outline: 2.5px solid var(--accent); outline-offset: 1px; color: var(--ink); }
.chip.practice { font-family: var(--ui); font-weight: 700; }

.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 72px; display: grid; gap: 18px; }
.wrap > * { min-width: 0; }
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px 18px;
  display: grid; gap: 8px; max-width: 900px; }
.notice strong { font-size: 17px; }
.notice p { color: var(--ink-2); max-width: 70ch; }
.notice.info { border-color: #b7cbec; background: var(--accent-soft); }
.notice.warn { border-color: #e6c27a; background: var(--warn-soft); }
.notice.bad { border-color: #f0a9a2; background: var(--bad-soft); }
.notice .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

.signin { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 22px 22px 20px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; width: 100%; max-width: 460px; }
.signin > * { min-width: 0; }
.signin h2 { font-size: 20px; }
.signin p { color: var(--ink-2); font-size: 15px; }
.signin .field { display: grid; gap: 6px; }
.signin label { font-size: 14px; font-weight: 700; }
.signin input { border: 1.5px solid var(--line-strong); border-radius: 8px; padding: 11px 12px; background: var(--surface);
  font-size: 17px; width: 100%; min-width: 0; }
.signin .err { color: var(--bad); font-size: 14.5px; font-weight: 700; min-height: 1em; }
.signin small { color: var(--muted); font-size: 13.5px; line-height: 1.45; }

details.guide { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); }
details.guide > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; font-size: 16px; list-style: none;
  display: flex; align-items: center; gap: 10px; }
details.guide > summary::-webkit-details-marker { display: none; }
details.guide > summary::before { content: "›"; display: inline-block; font-size: 20px; line-height: 1; color: var(--accent);
  transition: transform .2s; }
details.guide[open] > summary::before { transform: rotate(90deg); }
details.guide > summary span { font-weight: 400; color: var(--muted); font-size: 14px; }
.guide-body { padding: 0 18px 18px; display: grid; gap: 14px; }
.rules { white-space: pre-wrap; font: 15px/1.65 var(--ui); color: var(--ink-2); background: var(--sunk);
  border-radius: 8px; padding: 14px 16px; margin: 0; overflow-x: auto; }

.panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); }
.stepbar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; }
.stepbar h2 { font-size: 18px; }
.stepbar .count { font-size: 14px; color: var(--muted); }
.topic { font: 600 24px/1.25 var(--read); }
.alone { max-width: 820px; padding: 20px 22px; display: grid; gap: 16px; }
.slot { font: 500 13px/1 var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px;
  padding: 6px 9px; justify-self: start; }
.summary { font: 18px/1.7 var(--read); color: var(--ink); max-width: 70ch; white-space: pre-wrap; }
.actions-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.fixed { font-size: 14.5px; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 8px 12px; justify-self: start; }

.work { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
.reviews { position: sticky; top: 132px; max-height: calc(100vh - 150px); overflow: auto; padding: 18px 20px; display: grid; gap: 14px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
.group-head b { font-size: 16px; }
.group-head small { color: var(--muted); font-size: 13px; }
.group-head .minor { font: 500 12px/1 var(--mono); padding: 4px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.group.pos .group-head { border-color: var(--pos); }
.group.neg .group-head { border-color: var(--neg); }
.reviews ol { list-style: none; margin: 0; padding: 0; }
.reviews li { padding: 10px 0; border-bottom: 1px solid var(--sunk); font: 16.5px/1.65 var(--read); max-width: 68ch; }
.reviews li:last-child { border-bottom: 0; }
.cards { display: grid; gap: 14px; }
.card { padding: 18px 20px; display: grid; gap: 14px; }
.card[data-done="true"] { border-color: #8cc9a8; box-shadow: inset 4px 0 0 var(--ok); }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-size: 14.5px; font-weight: 700; color: var(--ink); padding: 0; margin-bottom: 2px; }
fieldset[disabled] { opacity: .5; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg label { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 9px;
  border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 15px; font-weight: 700;
  color: var(--ink-2); user-select: none; transition: background .12s, border-color .12s; }
.seg label:hover { border-color: var(--accent); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg input:checked + label::before { content: "✓"; font-size: 14px; }
.seg input:checked + label { color: var(--ink); background: var(--accent-soft); border-color: var(--accent); }
fieldset[disabled] label { cursor: default; }
.note input { border: 1.5px solid var(--line-strong); border-radius: 8px; padding: 10px 12px; background: var(--surface);
  width: 100%; font-size: 15px; }
.done-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 18px; border-radius: var(--radius); background: var(--ok-soft); border: 1px solid #8cc9a8; }
.done-bar p { font-weight: 700; color: var(--ok); }

@media (max-width: 900px) {
  .work { grid-template-columns: 1fr; }
  .reviews { position: static; max-height: none; }
  .top { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="brand">
        <span class="eyebrow">Keyword study · human check, part B</span>
        <h1>Review Summary Check: Part B</h1>
      </div>
      <div class="meter" id="meter" hidden>
        <b id="meter-label">0 of 0 sets done</b>
        <span class="track"><i id="meter-fill"></i></span>
      </div>
      <span class="save" id="save" data-state="idle" aria-live="polite"></span>
      <span class="who" id="who" hidden></span>
      <button class="btn ghost" id="signout" type="button" hidden>Sign out</button>
    </div>
    <nav class="strip" id="nav" aria-label="Sets" hidden>
      <span class="strip-label">Sets</span>
      <div class="chips" id="chips"></div>
    </nav>
  </div>
</header>

<div class="wrap">
  <div id="notices"></div>
  <details class="guide" id="guide">
    <summary>How to judge a set <span>· the two steps and the full guide</span></summary>
    <div class="guide-body"><pre class="rules" id="rules">Loading the guide…</pre></div>
  </details>
  <main id="main" hidden></main>
</div>

<script>
(() => {
  "use strict";
  const SLOTS = ["A", "B"];
  const Q2 = [["almost_all_negative", "Almost all negative"], ["mostly_negative", "Mostly negative"],
    ["evenly_split", "Evenly split"], ["mostly_positive", "Mostly positive"], ["almost_all_positive", "Almost all positive"]];
  const Q1 = [["none", "None"], ["some", "Some"], ["most", "Most"]];
  const Q3 = [["yes", "Yes"], ["no", "No"]];
  const Q4 = [["clear", "Clear"], ["minor_problems", "Minor problems"], ["hard_to_read", "Hard to read"]];
  const NAMES = Object.fromEntries([...Q2, ...Q1, ...Q3, ...Q4]);
  const S = { token: null, who: null, status: null, items: [], labels: {}, current: null, canSave: false,
    view: {}, timers: {}, saving: {}, again: {}, dirty: new Set(), failed: new Set() };
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "text") n.textContent = v; else if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid) n.append(kid);
    return n;
  };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (_) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} },
                  del: (k) => { try { localStorage.removeItem(k); } catch (_) {} } };
  // The same sign-in as Part A's page. A personal link (?t=<token>) still works: keep it and take it
  // out of the address bar.
  (function readToken() {
    const url = new URL(location.href);
    const t = url.searchParams.get("t");
    if (t) { S.token = t; store.set("rsc-token", t); url.searchParams.delete("t"); history.replaceState(null, "", url.pathname + url.search + url.hash); }
    else S.token = store.get("rsc-token");
  })();

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { "content-type": "application/json", "x-annotator-token": S.token || "", ...(opts.headers || {}) } });
    let body = null; try { body = await r.json(); } catch (_) {}
    if (!r.ok) { const e = new Error((body && body.error) || `HTTP ${r.status}`); e.status = r.status; throw e; }
    return body;
  }
  function notice(kind, title, body, actions) {
    const box = el("div", { class: `notice ${kind}`, role: kind === "bad" ? "alert" : null }, el("strong", { text: title }));
    if (body) box.append(el("p", { text: body }));
    if (actions && actions.length) box.append(el("div", { class: "actions" }, ...actions));
    $("notices").replaceChildren(box);
  }
  const clearNotice = () => $("notices").replaceChildren();

  const blank = () => ({ q1: null, q2: null, q3: null, q4: null, note: "" });
  const L = (sid) => { if (!S.labels[sid]) S.labels[sid] = { revealed: false, A: blank(), B: blank() }; return S.labels[sid]; };
  const complete = (l) => !!l && l.revealed === true && SLOTS.every((s) => l[s] && l[s].q1 && l[s].q2 && l[s].q3 && l[s].q4);
  const touched = (l) => !!l && SLOTS.some((s) => l[s] && (l[s].q1 || l[s].q2 || l[s].q3 || l[s].q4));
  const state = (it) => { const l = S.labels[it.id]; return complete(l) ? "done" : touched(l) ? "partial" : "empty"; };
  const study = () => S.items.filter((it) => !it.practice);
  const stage = (it) => { const l = L(it.id); return l.revealed ? "reviews" : S.view[it.id] || (l.A.q2 ? "B" : "A"); };
  const locked = () => !S.canSave || S.status === "closed";
  const nextOpen = (fromId) => {
    const list = study();
    const at = list.findIndex((x) => x.id === fromId);
    for (let k = 0; k < list.length; k++) {
      const it = list[(at + 1 + k) % list.length];
      if (it.id !== fromId && state(it) !== "done") return it;
    }
    return null;
  };

  function renderMeter() {
    const list = study(), done = list.filter((it) => state(it) === "done").length;
    $("meter").hidden = list.length === 0;
    $("meter-label").textContent = `${done} of ${list.length} sets done`;
    $("meter-fill").style.width = list.length ? `${(100 * done / list.length).toFixed(1)}%` : "0";
  }
  function renderSave() {
    const s = $("save");
    if (!S.canSave) { s.textContent = ""; s.dataset.state = "idle"; return; }
    if (S.failed.size) {
      s.dataset.state = "error";
      s.replaceChildren(el("span", { text: "Not saved" }),
        el("button", { class: "btn ghost", type: "button", text: "Retry", onclick: () => [...S.failed].forEach(flush) }));
    } else if (S.dirty.size || Object.values(S.saving).some(Boolean)) { s.dataset.state = "saving"; s.textContent = "Saving…"; }
    else { s.dataset.state = "saved"; s.textContent = "Saved"; }
  }
  function queueSave(sid) {
    S.dirty.add(sid);
    clearTimeout(S.timers[sid]);
    S.timers[sid] = setTimeout(() => flush(sid), 900);
    renderSave();
  }
  async function flush(sid) {
    clearTimeout(S.timers[sid]);
    if (S.saving[sid]) { S.again[sid] = true; return true; }
    S.saving[sid] = true; S.dirty.delete(sid);
    let ok = true;
    try {
      await api("/api/b/labels", { method: "PUT", body: JSON.stringify({ sid, labels: S.labels[sid] }) });
      S.failed.delete(sid);
    } catch (e) {
      ok = false; S.failed.add(sid);
      if (e.status === 401 || e.status === 403) { S.canSave = false; notice("warn", "Your answers can't be saved.", e.message); }
      else if (e.status === 400) notice("warn", "That answer was not saved.", e.message);
    } finally { S.saving[sid] = false; }
    if (S.again[sid]) { S.again[sid] = false; return flush(sid); }
    renderSave(); renderMeter(); updateChip(sid);
    return ok;
  }

  function renderNav() {
    $("nav").hidden = S.items.length === 0;
    $("chips").replaceChildren(...S.items.map((it) => el("button", {
      class: "chip" + (it.practice ? " practice" : ""), type: "button", "data-state": state(it), "data-id": it.id,
      "aria-current": String(it.id === S.current), text: it.practice ? "Practice" : it.id.replace(/^B/, ""),
      title: it.practice ? "Practice set (not part of the study)" : `Set ${it.id}`,
      "aria-label": it.practice ? "Practice set (not part of the study)" : `Set ${it.id}`,
      onclick: () => { open(it.id); window.scrollTo({ top: 0 }); },
    })));
  }
  function updateChip(sid) {
    const it = S.items.find((x) => x.id === sid);
    const chip = $("chips").querySelector(`[data-id="${sid}"]`);
    if (it && chip) chip.dataset.state = state(it);
  }

  function radios(name, values, current, onPick, disabled) {
    const seg = el("div", { class: "seg" });
    for (const [value, label] of values) {
      const id = `${name}-${value}`;
      const input = el("input", { type: "radio", name, id, value, checked: current === value ? "" : null });
      input.addEventListener("change", () => onPick(value));
      seg.append(input, el("label", { for: id, text: label }));
    }
    const fs = el("fieldset", {}, seg);
    fs.disabled = !!disabled;
    return fs;
  }
  function question(legend, hint, name, values, current, onPick, disabled) {
    const fs = radios(name, values, current, onPick, disabled);
    fs.prepend(el("legend", { text: legend }));
    if (hint) fs.append(el("p", { class: "hint", text: hint }));
    return fs;
  }
  function answer(it, slot, q, value) {
    if (S.welcome) { S.welcome = false; clearNotice(); }  // the first answer puts the welcome away
    L(it.id)[slot][q] = value;
    if (S.canSave) queueSave(it.id);
    updateChip(it.id); renderMeter();
  }

  // Step 1: one summary on its own, then its overall feeling.
  function stepAlone(it, slot) {
    const l = L(it.id);
    const box = el("section", { class: "panel alone", "aria-labelledby": "step-title" });
    box.append(el("div", { class: "stepbar" },
      el("h2", { id: "step-title", text: `Step 1 · Summary ${slot} on its own` }),
      el("span", { class: "count", text: it.practice ? "Practice set, not part of the study" : `Set ${it.id}` })));
    box.append(el("p", { class: "topic", text: it.topic }));
    box.append(el("span", { class: "slot", text: `Summary ${slot}` }), el("p", { class: "summary", text: it.summaries[slot] }));
    const go = el("button", { class: "btn primary", type: "button" });
    const back = slot === "B" ? el("button", { class: "btn", type: "button", text: "← Back to summary A",
      onclick: () => { S.view[it.id] = "A"; open(it.id); } }) : null;
    const sync = () => { go.disabled = !l[slot].q2 || locked(); };
    box.append(question("From this summary alone, how do the reviewers feel overall?",
      "Judge what the summary conveys, not what you expect the reviews to say.",
      `${it.id}-${slot}-q2`, Q2, l[slot].q2, (v) => { answer(it, slot, "q2", v); sync(); }, locked()));
    if (slot === "A") {
      go.textContent = "Next: summary B →";
      go.onclick = () => { S.view[it.id] = "B"; open(it.id); };
    } else {
      go.textContent = "Open the reviews →";
      go.onclick = () => reveal(it, go);
    }
    sync();
    box.append(el("div", { class: "actions-row" }, back, go));
    if (slot === "B") box.append(el("p", { class: "hint", text: "When you open the reviews, your two answers about the overall feeling are fixed." }));
    return box;
  }
  async function reveal(it, button) {
    const l = L(it.id);
    if (!l.A.q2 || !l.B.q2) return;
    button.disabled = true; button.textContent = "Opening…";
    l.revealed = true;
    const ok = await flush(it.id);
    if (!ok) { l.revealed = false; button.disabled = false; button.textContent = "Open the reviews →"; return; }
    delete S.view[it.id];
    open(it.id);
  }

  // Step 2: the reviews, grouped by rating, and three questions per summary.
  function stepReviews(it) {
    const l = L(it.id);
    const minorName = it.minority === "negative" ? "negative" : "positive";
    const group = (side) => {
      const list = it.reviews[side] || [];
      const head = el("div", { class: "group-head" },
        el("b", { text: `${side === "positive" ? "Positive" : "Negative"} reviews · ${list.length}` }),
        el("small", { text: (it.rating_rule || {})[side] || "" }),
        side === it.minority ? el("span", { class: "minor", text: "smaller group" }) : null);
      return el("div", { class: `group ${side === "positive" ? "pos" : "neg"}` }, head,
        el("ol", {}, ...list.map((r) => el("li", { text: r }))));
    };
    const aside = el("aside", { class: "panel reviews", "aria-label": "The 8 reviews" },
      el("p", { class: "topic", text: it.topic }), group("positive"), group("negative"));
    const cards = el("div", { class: "cards" });
    const doneBar = el("div", { class: "done-bar", hidden: "" });
    const renderDone = () => {
      const all = complete(l), nxt = nextOpen(it.practice ? null : it.id);
      doneBar.hidden = !all;
      doneBar.replaceChildren(el("p", { text: it.practice ? "Practice done. The study sets are next." :
        nxt ? "This set is done." : "Every set is done. Thank you!" }),
        nxt ? el("button", { class: "btn primary", type: "button", text: "Next unfinished set →",
          onclick: () => { open(nxt.id); window.scrollTo({ top: 0 }); } }) : null);
    };
    for (const slot of SLOTS) {
      const a = l[slot];
      const card = el("article", { class: "panel card", "data-done": "false", "aria-label": `Summary ${slot}` });
      const mark = () => { card.dataset.done = String(!!(a.q1 && a.q3 && a.q4)); renderDone(); };
      const pick = (q) => (v) => { answer(it, slot, q, v); mark(); };
      card.append(el("span", { class: "slot", text: `Summary ${slot}` }), el("p", { class: "summary", text: it.summaries[slot] }));
      card.append(el("p", { class: "fixed", text: `Overall feeling you gave in step 1: ${NAMES[a.q2] || "–"}` }));
      card.append(question(`How much of what the ${minorName} reviewers say does summary ${slot} convey?`,
        slot === "A" ? "The smaller group is marked next to the reviews. None: nothing of it appears. Some: part of it. Most: most or all of it." : null,
        `${it.id}-${slot}-q1`, Q1, a.q1, pick("q1"), locked()));
      card.append(question(`Does summary ${slot} say anything no review supports, including a wrong number?`, null,
        `${it.id}-${slot}-q3`, Q3, a.q3, pick("q3"), locked()));
      const noteId = `${it.id}-${slot}-note`;
      const note = el("input", { id: noteId, type: "text", maxlength: "500", placeholder: "Optional: what has no support?" });
      note.value = a.note || ""; note.disabled = locked();
      note.addEventListener("input", () => { a.note = note.value; if (S.canSave) queueSave(it.id); });
      card.append(el("div", { class: "note" }, el("label", { for: noteId, class: "hint", text: "Note (optional)" }), note));
      card.append(question(`How easy is summary ${slot} to read?`, null, `${it.id}-${slot}-q4`, Q4, a.q4, pick("q4"), locked()));
      mark();
      cards.append(card);
    }
    const right = el("section", { class: "cards", "aria-labelledby": "step-title" },
      el("div", { class: "stepbar" }, el("h2", { id: "step-title", text: "Step 2 · Read the reviews, then judge both summaries" }),
        el("span", { class: "count", text: it.practice ? "Practice set, not part of the study" : `Set ${it.id}` })),
      cards, doneBar);
    renderDone();
    return el("div", { class: "work" }, aside, right);
  }

  function open(sid) {
    const it = S.items.find((x) => x.id === sid) || S.items[0];
    if (!it) return;
    S.current = it.id; store.set("rsc-b-current", it.id);
    const st = stage(it);
    $("main").hidden = false;
    $("main").replaceChildren(st === "reviews" ? stepReviews(it) : stepAlone(it, st));
    $("chips").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-current", String(c.dataset.id === it.id)));
    const chip = $("chips").querySelector(`[data-id="${it.id}"]`);
    if (chip && chip.scrollIntoView) chip.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function welcome() {
    const practice = S.items.find((x) => x.practice);
    S.welcome = true;
    notice("info", `Welcome, ${S.who}.`,
      `You will judge ${study().length} sets, each with two short summaries of the same 8 reviews, about 3 minutes a set. First you read each summary on its own and say how the reviewers feel overall. Then you open the reviews and answer three questions about each summary. Everything saves as you go; sign in again with the same name and PIN to continue. Start with the practice set; it is not part of the study.`,
      [practice ? el("button", { class: "btn primary", type: "button", text: "Start the practice set", onclick: () => { S.welcome = false; clearNotice(); open(practice.id); } }) : null,
       el("button", { class: "btn", type: "button", text: "Read the full guide", onclick: () => { $("guide").open = true; $("guide").scrollIntoView({ behavior: "smooth" }); } })].filter(Boolean));
  }
  function signOut() { store.del("rsc-token"); store.del("rsc-b-current"); location.replace(location.pathname); }
  $("signout").addEventListener("click", () => {
    if ((S.dirty.size || S.failed.size) && !confirm("Some answers are not saved yet. Sign out anyway?")) return;
    signOut();
  });

  function signIn(message) {
    $("main").hidden = true; $("nav").hidden = true; $("meter").hidden = true;
    const err = el("p", { class: "err", role: "alert", text: message || "" });
    const name = el("input", { id: "si-name", name: "username", autocomplete: "username", autocapitalize: "none",
      spellcheck: "false", maxlength: "20", required: "" });
    const pin = el("input", { id: "si-pin", name: "pin", type: "password", inputmode: "numeric", autocomplete: "current-password",
      pattern: "[0-9]{4,8}", maxlength: "8", required: "" });
    const go = el("button", { class: "btn primary", type: "submit", text: "Sign in" });
    const form = el("form", { class: "signin", novalidate: "" },
      el("h2", { text: "Sign in to start Part B" }),
      el("p", { text: "Use the same name and PIN as for Part A, or choose them now if you are new." }),
      el("div", { class: "field" }, el("label", { for: "si-name", text: "Your name" }), name),
      el("div", { class: "field" }, el("label", { for: "si-pin", text: "PIN" }), pin,
        el("small", { text: "4 to 8 digits. Next time, enter the same PIN." })),
      err, go);
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.textContent = "";
      if (!/^\d{4,8}$/.test(pin.value.trim())) { err.textContent = "Your PIN must be 4 to 8 digits."; pin.focus(); return; }
      go.disabled = true; go.textContent = "Signing in…";
      try {
        const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: name.value, pin: pin.value.trim() }) });
        let body = null; try { body = await r.json(); } catch (_) {}
        if (!r.ok) throw new Error((body && body.error) || `HTTP ${r.status}`);
        S.token = body.token; store.set("rsc-token", body.token);
        boot();
      } catch (e) {
        err.textContent = e.message === "Failed to fetch" ? "Could not reach the site. Check your connection." : e.message;
        go.disabled = false; go.textContent = "Sign in";
      }
    });
    $("notices").replaceChildren(form);
    name.focus();
  }

  async function boot() {
    if (!S.token) { signIn(); return; }
    notice("", "Loading…", "");
    try {
      const data = await api("/api/b/items");
      S.who = data.annotator; S.status = data.status; S.items = data.items;
      $("rules").textContent = (data.guide || []).join("\n");
      $("who").hidden = false; $("who").textContent = S.who; $("signout").hidden = false;
      if (!data.assigned) {
        notice("warn", "You are not on the Part B list yet.", `Tell the study owner the name you signed in with (${S.who}), then reload this page.`,
          [el("button", { class: "btn", type: "button", text: "Sign in with another name", onclick: signOut })]);
        return;
      }
      const mine = await api("/api/b/labels");
      S.labels = JSON.parse(JSON.stringify(mine.labels || {}));
      S.canSave = S.status !== "closed";
      clearNotice();
      renderNav(); renderMeter();
      if (S.status === "closed") notice("info", "Part B is closed.", "Thank you. Your answers are saved and can no longer be changed.");
      if (!study().some((it) => touched(S.labels[it.id]))) {
        if (S.status !== "closed") welcome();
        open((S.items.find((x) => x.practice) || S.items[0]).id);
      } else {
        const saved = store.get("rsc-b-current");
        const first = study().find((x) => state(x) !== "done") || S.items[0];
        open(S.items.some((x) => x.id === saved) ? saved : first.id);
      }
      renderSave();
    } catch (e) {
      if (e.status === 401) { store.del("rsc-token"); S.token = null; signIn("Please sign in again."); }
      else if (e.status === 503) notice("warn", "Part B is not open yet.", e.message);
      else notice("bad", "The page could not load.", "Check your connection and reload. If it keeps failing, tell the study owner.");
    }
  }
  window.addEventListener("beforeunload", (ev) => { if (S.dirty.size || S.failed.size) ev.preventDefault(); });
  boot();
})();
</script>
</body>
</html>
